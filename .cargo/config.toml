# libopus (vendored by audiopus_sys) still declares a cmake_minimum_required
# that CMake 4 refuses outright. Without this the whole audio stack fails to
# build on any machine with a current CMake. See ADR-0015.
#
# This file lives at the repo root, not in src-tauri/: cargo discovers config
# by walking up from the *current directory*, so a config next to the manifest
# is invisible to `cargo test --manifest-path src-tauri/Cargo.toml` run from
# the root — which is how CI and every agent invokes it (ADR-0016).
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
