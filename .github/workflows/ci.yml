name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Lint + test (frontend)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  desktop:
    # All three platforms record system audio, each through its own backend
    # (ADR-0024), and each backend is `#[cfg]`-gated — so it is only ever
    # compiled, linted and tested on its own runner. That makes this matrix
    # the only thing standing between a platform-specific mistake and a user;
    # the release workflow ships from these same three runners (ADR-0023).
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundles: msi,nsis
          - os: macos-latest
            label: macOS
            bundles: app,dmg
          - os: ubuntu-22.04
            label: Linux
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # Tauri links against WebKitGTK and the tray indicator, cpal against
      # ALSA, and the vendored libopus/whisper.cpp need a C toolchain — none
      # of which the runner image ships.
      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libpulse-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            build-essential \
            patchelf \
            file \
            cmake

      - run: npm ci

      # Before *any* cargo command: `custom-protocol` is a default feature, so
      # `generate_context!` embeds `dist/` at compile time and panics when it
      # is not there. `tauri build` would run this itself, but `cargo test`
      # below comes first and needs it just as much.
      - run: npm run build

      # Style is platform-independent, so it is checked once rather than three
      # times.
      - name: Format
        if: matrix.os == 'windows-latest'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Clippy runs on every platform, not just Windows: `macos.rs` and
      # `linux.rs` are `#[cfg]`-gated, so a Windows-only lint pass never sees
      # either of them. The compilation is shared with the build below.
      - name: Clippy
        timeout-minutes: 45
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        timeout-minutes: 45
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tauri build
        timeout-minutes: 60
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      # The failure this catches is silent: a binary compiled without
      # `tauri/custom-protocol` opens the dev-server URL instead of the
      # embedded UI, so it looks perfect on a machine running `npm run dev`
      # and shows "connection refused" everywhere else. Nothing about the
      # build fails — the app simply has no interface in it.
      - name: Verify the frontend is embedded in the binary
        shell: bash
        run: bash .github/scripts/verify-embedded-frontend.sh

      # macOS terminates an app that touches the microphone or
      # ScreenCaptureKit without a purpose string in its bundle — so a
      # dropped `Info.plist` merge does not degrade recording, it kills the
      # process the instant the user presses Record. Nothing about the build
      # fails when that happens, and the app runs fine right up to the moment
      # it matters, so the built bundle is asked directly (ADR-0024).
      - name: Verify the macOS permission strings reached the bundle
        if: matrix.os == 'macos-latest'
        run: bash .github/scripts/verify-macos-plist.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: resumeira-${{ matrix.label }}
          # Only the installers and the binary, not the whole target directory.
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/resumeira
            src-tauri/target/release/resumeira.exe
          if-no-files-found: warn
          retention-days: 14
