name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Lint + test (frontend)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  desktop:
    # Windows is the product target (ADR-0003): it is the only platform where
    # system-audio capture exists. macOS and Linux build here anyway, because
    # a port that is never compiled rots — the `#[cfg(not(windows))]` stubs,
    # the keychain backends and the bundler config all get a real check, and
    # the release workflow ships from the same three runners (ADR-0023).
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundles: msi,nsis
          - os: macos-latest
            label: macOS
            bundles: app,dmg
          - os: ubuntu-22.04
            label: Linux
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # Tauri links against WebKitGTK and the tray indicator, cpal against
      # ALSA, and the vendored libopus/whisper.cpp need a C toolchain — none
      # of which the runner image ships.
      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            build-essential \
            patchelf \
            file \
            cmake

      - run: npm ci

      # Before *any* cargo command: `custom-protocol` is a default feature, so
      # `generate_context!` embeds `dist/` at compile time and panics when it
      # is not there. `tauri build` would run this itself, but `cargo test`
      # below comes first and needs it just as much.
      - run: npm run build

      # Style is platform-independent, so it is checked once rather than three
      # times.
      - name: Format
        if: matrix.os == 'windows-latest'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        if: matrix.os == 'windows-latest'
        timeout-minutes: 45
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        timeout-minutes: 45
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tauri build
        timeout-minutes: 60
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      # The failure this catches is silent: a binary compiled without
      # `tauri/custom-protocol` opens the dev-server URL instead of the
      # embedded UI, so it looks perfect on a machine running `npm run dev`
      # and shows "connection refused" everywhere else. Nothing about the
      # build fails — the app simply has no interface in it.
      - name: Verify the frontend is embedded in the binary
        shell: bash
        run: bash .github/scripts/verify-embedded-frontend.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: resumeira-${{ matrix.label }}
          # Only the installers and the binary, not the whole target directory.
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/resumeira
            src-tauri/target/release/resumeira.exe
          if-no-files-found: warn
          retention-days: 14
