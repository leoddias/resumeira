[package]
name = "resumeira"
version = "0.1.0"
description = "Local-first meeting notes"
authors = ["Leonardo Dias"]
license = "AGPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.85"

[lib]
name = "resumeira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
cpal = "0.18.2"
opus = "0.3.1"
ogg = "0.9.2"
chrono = "0.4.45"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["fs", "io-util"] }
whisper-rs = "0.16.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "multipart"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
tauri-plugin-opener = "2.5.4"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
